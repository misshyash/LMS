
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trainito Academy | Immersive Learning</title>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
    "recharts": "https://esm.sh/recharts@2.12.7",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",

  }

</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-teal: #66c2bd;
            --brand-coral: #f04434;
        }
        body { 
          font-family: 'Plus Jakarta Sans', sans-serif; 
          transition: background-color 0.5s ease;
          overflow-x: hidden;
        }
        .bg-aura {
          position: fixed;
          top: 0; left: 0; right: 0; bottom: 0;
          z-index: -1;
          background: radial-gradient(circle at 10% 20%, rgba(102, 194, 189, 0.05) 0%, transparent 40%),
                      radial-gradient(circle at 90% 80%, rgba(240, 68, 52, 0.05) 0%, transparent 40%);
          filter: blur(80px);
          animation: drift 20s infinite alternate ease-in-out;
        }
        .dark .bg-aura {
          background: radial-gradient(circle at 10% 20%, rgba(102, 194, 189, 0.15) 0%, transparent 40%),
                      radial-gradient(circle at 90% 80%, rgba(240, 68, 52, 0.15) 0%, transparent 40%);
        }
        @keyframes drift {
          from { transform: scale(1) translate(0,0); }
          to { transform: scale(1.1) translate(20px, 20px); }
        }
        .glass { 
          backdrop-filter: blur(24px); 
          border: 1px solid rgba(255, 255, 255, 0.12);
          background: rgba(255, 255, 255, 0.7);
        }
        .dark .glass {
          background: rgba(15, 23, 42, 0.6);
          border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .text-gradient {
          background: linear-gradient(135deg, var(--brand-teal), #4361ee);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }
        .btn-shimmer {
          position: relative;
          overflow: hidden;
        }
        .btn-shimmer::after {
          content: '';
          position: absolute;
          top: -50%; left: -50%;
          width: 200%; height: 200%;
          background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
          transform: rotate(45deg);
          animation: shimmer 4s infinite;
        }
        @keyframes shimmer {
          0% { transform: translateX(-100%) rotate(45deg); }
          100% { transform: translateX(100%) rotate(45deg); }
        }
        .certificate-shadow {
          box-shadow: 0 30px 60px -12px rgba(0,0,0,0.1), 0 18px 36px -18px rgba(0,0,0,0.15);
        }

        @media print {
            body { 
              background: white !important; 
              padding: 0 !important;
              margin: 0 !important;
            }
            .no-print, header, .bg-aura, button, .glass::before { 
              display: none !important; 
            }
            #certificate-print {
              position: fixed !important;
              top: 0 !important;
              left: 0 !important;
              width: 100% !important;
              height: 100% !important;
              margin: 0 !important;
              padding: 2cm !important;
              border: 15px solid #66c2bd !important;
              box-shadow: none !important;
              visibility: visible !important;
            }
            main {
              padding-top: 0 !important;
              margin: 0 !important;
            }
            * {
              -webkit-print-color-adjust: exact !important;
              color-adjust: exact !important;
            }
        }
    </style>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              trainito: { teal: '#66c2bd', coral: '#f04434' }
            },
            borderRadius: { '4xl': '2rem', '5xl': '3rem' }
          }
        }
      }
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen">

    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
</body>
</html>
